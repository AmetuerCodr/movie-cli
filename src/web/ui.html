<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOV-CLI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; -webkit-font-smoothing: antialiased; }

    body {
      background: #141414;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── Nav ────────────────────────────────────────────── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 40px;
    }

    .logo {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
    }

    /* ── Search ─────────────────────────────────────────── */
    .search-wrap { position: relative; }

    .search-wrap svg {
      position: absolute; left: 0; top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.35);
      pointer-events: none;
    }

    #search-input {
      background: none;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      padding: 6px 0 6px 24px;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }

    #search-input::placeholder { color: rgba(255,255,255,0.3); }
    #search-input:focus { border-bottom-color: rgba(255,255,255,0.6); }

    /* ── Section label ──────────────────────────────────── */
    .section { padding: 0 40px 48px; }

    .section-label {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 20px;
    }

    /* ── Grid ───────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    /* ── Card ───────────────────────────────────────────── */
    .card {
      cursor: pointer;
    }

    .card-img {
      position: relative;
      aspect-ratio: 2/3;
      overflow: hidden;
      background: #1e1e1e;
    }

    .card-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s;
    }

    .card:hover .card-img img { opacity: 0.55; }

    .card-img-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .card:hover .card-img-overlay { opacity: 1; }

    .play-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center;
    }

    .play-icon svg { margin-left: 2px; }

    .card-meta {
      padding: 9px 0 0;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 400;
      color: rgba(255,255,255,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }

    .card-sub {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.3);
      margin-top: 2px;
      display: flex; gap: 8px;
    }

    .card-rating { color: rgba(255,255,255,0.45); }

    /* ── Hero ───────────────────────────────────────────── */
    .hero {
      padding: 0 40px 56px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: end;
    }

    .hero-poster {
      aspect-ratio: 2/3;
      max-height: 480px;
      width: auto;
      background: #1e1e1e;
      overflow: hidden;
    }

    .hero-poster img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }

    .hero-info { padding-bottom: 8px; }

    .hero-eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: 2.8rem;
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .hero-overview {
      font-size: 0.82rem;
      line-height: 1.7;
      color: rgba(255,255,255,0.45);
      max-width: 420px;
      margin-bottom: 28px;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-meta {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.08em;
      display: flex; gap: 16px;
      margin-bottom: 28px;
    }

    .watch-btn {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 12px 24px;
      background: none;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .watch-btn:hover {
      border-color: #fff;
    }

    /* ── Loading ────────────────────────────────────────── */
    .loading {
      padding: 80px 40px;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }

    /* ── Search results ─────────────────────────────────── */
    .search-bar {
      display: flex; align-items: center; gap: 16px;
      padding: 0 40px 32px;
    }

    .search-label {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }

    .search-term {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.7);
    }

    .back-btn {
      background: none; border: none; cursor: pointer;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-left: auto;
      transition: color 0.2s;
    }

    .back-btn:hover { color: #fff; }

    /* ── Empty ──────────────────────────────────────────── */
    .empty {
      padding: 80px 40px;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }

    /* ── Toast ──────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 32px; left: 40px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.6);
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      pointer-events: none;
    }

    #toast.show { transform: translateY(0); opacity: 1; }

    /* ── Divider ────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 0 40px 48px;
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 900px) {
      nav { padding: 20px 24px; }
      .section { padding: 0 24px 40px; }
      .divider { margin: 0 24px 40px; }
      .hero { padding: 0 24px 48px; grid-template-columns: 1fr; }
      .hero-poster { display: none; }
      .hero-title { font-size: 2rem; }
      .grid { grid-template-columns: repeat(4, 1fr); }
      .row { grid-template-columns: repeat(4, 1fr); }
      .search-bar { padding: 0 24px 28px; }
      .empty, .loading { padding: 60px 24px; }
    }

    @media (max-width: 560px) {
      .grid, .row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      #search-input { width: 160px; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav>
    <span class="logo">Mov-CLI</span>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search-input" type="text" placeholder="Search…" autocomplete="off" spellcheck="false">
    </div>
  </nav>

  <!-- Main -->
  <main id="main"></main>

  <div id="toast"></div>

  <script>
    const IMG_BASE = '/img';

    function posterSrc(path, size = 'w342') {
      return path ? `${IMG_BASE}/${size}${path}` : null;
    }

    function backdropSrc(path) {
      return path ? `${IMG_BASE}/w1280${path}` : null;
    }

    function title(item) { return item.title || item.name || 'Untitled'; }
    function year(item) {
      const d = item.release_date || item.first_air_date;
      return d ? d.slice(0, 4) : '';
    }
    function rating(item) {
      return item.vote_average ? item.vote_average.toFixed(1) : '';
    }
    function type(item) {
      if (item.media_type === 'tv') return 'Series';
      if (item.media_type === 'movie') return 'Film';
      return item.title ? 'Film' : 'Series';
    }

    // ── Toast ─────────────────────────────────────────────
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 3500);
    }

    function onWatch(item) {
      navigator.clipboard?.writeText('bunx mov-cli');
      toast(`Copied  ·  search "${title(item)}" in your terminal`);
    }

    // ── Card ──────────────────────────────────────────────
    function makeCard(item) {
      const src = posterSrc(item.poster_path);
      const t = title(item);
      const y = year(item);
      const r = rating(item);

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-img">
          ${src ? `<img src="${src}" alt="${t}" loading="lazy">` : ''}
          <div class="card-img-overlay">
            <div class="play-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="white">
                <polygon points="5,3 19,12 5,21"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="card-meta">
          <div class="card-title">${t}</div>
          <div class="card-sub">
            ${y ? `<span>${y}</span>` : ''}
            ${r ? `<span class="card-rating">${r}</span>` : ''}
          </div>
        </div>`;
      card.addEventListener('click', () => onWatch(item));
      return card;
    }

    // ── Hero ──────────────────────────────────────────────
    function renderHero(item) {
      const t = title(item);
      const y = year(item);
      const r = rating(item);
      const tp = type(item);
      const poster = posterSrc(item.poster_path, 'w500');

      const div = document.createElement('div');
      div.className = 'hero';
      div.innerHTML = `
        <div class="hero-poster">
          ${poster ? `<img src="${poster}" alt="${t}">` : ''}
        </div>
        <div class="hero-info">
          <div class="hero-eyebrow">${tp} · Trending Now</div>
          <h1 class="hero-title">${t}</h1>
          <div class="hero-meta">
            ${y ? `<span>${y}</span>` : ''}
            ${r ? `<span>${r} / 10</span>` : ''}
            ${item.original_language ? `<span>${item.original_language.toUpperCase()}</span>` : ''}
          </div>
          ${item.overview ? `<p class="hero-overview">${item.overview}</p>` : ''}
          <button class="watch-btn" id="hero-watch-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,3 19,12 5,21"/>
            </svg>
            Watch
          </button>
        </div>`;
      div.querySelector('#hero-watch-btn').addEventListener('click', () => onWatch(item));
      return div;
    }

    // ── Render row/grid of cards ──────────────────────────
    function makeGrid(items, cls = 'grid') {
      const el = document.createElement('div');
      el.className = cls;
      items.forEach(item => el.appendChild(makeCard(item)));
      return el;
    }

    // ── Section wrapper ───────────────────────────────────
    function makeSection(label, content) {
      const sec = document.createElement('div');
      sec.className = 'section';
      sec.innerHTML = `<div class="section-label">${label}</div>`;
      sec.appendChild(content);
      return sec;
    }

    // ── Home view ─────────────────────────────────────────
    function renderHome(trending) {
      const main = document.getElementById('main');
      main.innerHTML = '';

      const featured = trending[0];
      const rest = trending.slice(1);
      const films = rest.filter(i => i.media_type !== 'tv');
      const series = rest.filter(i => i.media_type === 'tv');

      // Hero
      if (featured) main.appendChild(renderHero(featured));

      const div1 = document.createElement('div'); div1.className = 'divider';
      main.appendChild(div1);

      main.appendChild(makeSection('Trending', makeGrid(rest.slice(0, 12), 'grid')));

      if (films.length > 0) {
        const div2 = document.createElement('div'); div2.className = 'divider';
        main.appendChild(div2);
        main.appendChild(makeSection('Films', makeGrid(films.slice(0, 7), 'row')));
      }

      if (series.length > 0) {
        const div3 = document.createElement('div'); div3.className = 'divider';
        main.appendChild(div3);
        main.appendChild(makeSection('Series', makeGrid(series.slice(0, 7), 'row')));
      }
    }

    // ── Search view ───────────────────────────────────────
    function renderSearch(results, query) {
      const main = document.getElementById('main');
      main.innerHTML = '';

      const bar = document.createElement('div');
      bar.className = 'search-bar';
      bar.innerHTML = `
        <span class="search-label">Results</span>
        <span class="search-term">"${query}"</span>
        <button class="back-btn" id="back">Clear</button>`;
      bar.querySelector('#back').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        loadHome();
      });
      main.appendChild(bar);

      if (results.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No results found';
        main.appendChild(empty);
        return;
      }

      main.appendChild(makeGrid(results, 'grid section'));
      main.querySelector('.section').style.paddingTop = '0';
    }

    // ── Data fetching ─────────────────────────────────────
    async function apiFetch(path) {
      const r = await fetch('/api' + path);
      if (!r.ok) throw new Error('API error');
      return r.json();
    }

    async function loadHome() {
      document.getElementById('main').innerHTML = '<div class="loading">Loading…</div>';
      try {
        const data = await apiFetch('/trending/all/week');
        const items = (data.results || []).filter(i => i.media_type !== 'person');
        renderHome(items);
      } catch {
        document.getElementById('main').innerHTML = '<div class="empty">Could not load content</div>';
      }
    }

    let searchTimer;
    document.getElementById('search-input').addEventListener('input', e => {
      clearTimeout(searchTimer);
      const q = e.target.value.trim();
      if (!q) { loadHome(); return; }
      searchTimer = setTimeout(async () => {
        document.getElementById('main').innerHTML = '<div class="loading">Searching…</div>';
        try {
          const data = await apiFetch(`/search/multi?query=${encodeURIComponent(q)}&language=en`);
          const results = (data.results || []).filter(i => i.media_type !== 'person');
          renderSearch(results, q);
        } catch {
          document.getElementById('main').innerHTML = '<div class="empty">Search failed</div>';
        }
      }, 420);
    });

    document.getElementById('search-input').addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.target.value = ''; loadHome(); }
    });

    loadHome();
  </script>
</body>
</html>
