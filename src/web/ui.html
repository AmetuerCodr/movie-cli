<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOV-CLI</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }

    body {
      background: #141414;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── Nav ─────────────────────────────────────────────── */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 28px 40px;
    }

    .logo {
      font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    .search-wrap { position: relative; }

    .search-wrap svg {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,0.35); pointer-events: none;
    }

    #search-input {
      background: none; border: none;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      color: #fff; font-size: 0.8rem; letter-spacing: 0.08em;
      padding: 6px 0 6px 24px; width: 220px; outline: none;
      transition: border-color 0.2s;
    }

    #search-input::placeholder { color: rgba(255,255,255,0.3); }
    #search-input:focus { border-bottom-color: rgba(255,255,255,0.6); }

    /* ── Sections ────────────────────────────────────────── */
    .section { padding: 0 40px 48px; }

    .section-label {
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); margin-bottom: 20px;
    }

    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
    .row  { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }

    /* ── Card ────────────────────────────────────────────── */
    .card { cursor: pointer; }

    .card-img {
      position: relative; aspect-ratio: 2/3;
      overflow: hidden; background: #1e1e1e;
    }

    .card-img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: opacity 0.3s;
    }

    .card:hover .card-img img { opacity: 0.5; }

    .card-img-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.25s;
    }

    .card:hover .card-img-overlay { opacity: 1; }

    .play-icon {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center;
    }

    .play-icon svg { margin-left: 2px; }

    .card-meta { padding: 9px 0 0; }

    .card-title {
      font-size: 0.75rem; font-weight: 400;
      color: rgba(255,255,255,0.85);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.4;
    }

    .card-sub {
      font-size: 0.68rem; color: rgba(255,255,255,0.3);
      margin-top: 2px; display: flex; gap: 8px;
    }

    /* ── Hero ────────────────────────────────────────────── */
    .hero {
      padding: 0 40px 56px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 40px; align-items: end;
    }

    .hero-poster {
      aspect-ratio: 2/3; max-height: 480px;
      background: #1e1e1e; overflow: hidden;
    }

    .hero-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .hero-info { padding-bottom: 8px; }

    .hero-eyebrow {
      font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); margin-bottom: 20px;
    }

    .hero-title {
      font-size: 2.8rem; font-weight: 300;
      line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 16px;
    }

    .hero-overview {
      font-size: 0.82rem; line-height: 1.7;
      color: rgba(255,255,255,0.45); max-width: 420px; margin-bottom: 28px;
      display: -webkit-box; -webkit-line-clamp: 4;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    .hero-meta {
      font-size: 0.7rem; color: rgba(255,255,255,0.3);
      letter-spacing: 0.08em; display: flex; gap: 16px; margin-bottom: 28px;
    }

    .watch-btn {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: #fff; border: 1px solid rgba(255,255,255,0.3);
      padding: 12px 24px; background: none; cursor: pointer;
      transition: border-color 0.2s;
    }

    .watch-btn:hover { border-color: #fff; }

    /* ── State labels ─────────────────────────────────────── */
    .loading, .empty {
      padding: 80px 40px; font-size: 0.7rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }

    /* ── Search header ───────────────────────────────────── */
    .search-bar {
      display: flex; align-items: center; gap: 16px;
      padding: 0 40px 32px;
    }

    .search-label {
      font-size: 0.65rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: rgba(255,255,255,0.3);
    }

    .search-term { font-size: 0.65rem; color: rgba(255,255,255,0.7); }

    .back-btn {
      background: none; border: none; cursor: pointer;
      font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); margin-left: auto; transition: color 0.2s;
    }

    .back-btn:hover { color: #fff; }

    .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 0 40px 48px; }

    /* ── Player ──────────────────────────────────────────── */
    #player-view {
      position: fixed; inset: 0; z-index: 200;
      background: #000;
      display: none; flex-direction: column;
    }

    #player-view.open { display: flex; }

    #video {
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }

    #player-ui {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: space-between;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }

    #player-view:hover #player-ui,
    #player-view.show-ui #player-ui { opacity: 1; pointer-events: all; }

    .player-top {
      padding: 24px 28px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
      display: flex; align-items: center; gap: 16px;
    }

    #player-back {
      background: none; border: none; cursor: pointer;
      font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: rgba(255,255,255,0.7); transition: color 0.15s;
    }

    #player-back:hover { color: #fff; }

    #player-title {
      font-size: 0.85rem; font-weight: 400;
      color: rgba(255,255,255,0.8); letter-spacing: 0.04em;
    }

    /* ── Player loading / error ──────────────────────────── */
    #player-status {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      pointer-events: none;
    }

    #player-status-text {
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    #player-status-sub {
      font-size: 0.65rem; color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em; max-width: 360px; text-align: center;
      white-space: pre-line;
    }

    /* animated dots */
    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%  { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 900px) {
      nav { padding: 20px 24px; }
      .section { padding: 0 24px 40px; }
      .divider { margin: 0 24px 40px; }
      .hero { padding: 0 24px 48px; grid-template-columns: 1fr; }
      .hero-poster { display: none; }
      .hero-title { font-size: 2rem; }
      .grid { grid-template-columns: repeat(4, 1fr); }
      .row  { grid-template-columns: repeat(4, 1fr); }
      .search-bar { padding: 0 24px 28px; }
      .loading, .empty { padding: 60px 24px; }
    }

    @media (max-width: 560px) {
      .grid, .row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      #search-input { width: 160px; }
    }
  </style>
</head>
<body>

  <nav>
    <span class="logo">Mov-CLI</span>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search-input" type="text" placeholder="Search…" autocomplete="off" spellcheck="false">
    </div>
  </nav>

  <main id="main"></main>

  <!-- ── Player ──────────────────────────────────────────── -->
  <div id="player-view">
    <video id="video" controls></video>

    <div id="player-ui">
      <div class="player-top">
        <button id="player-back">← Back</button>
        <span id="player-title"></span>
      </div>
    </div>

    <div id="player-status">
      <div id="player-status-text"></div>
      <div id="player-status-sub"></div>
    </div>
  </div>

  <script>
    // ── Helpers ───────────────────────────────────────────────
    function itemTitle(i) { return i.title || i.name || 'Untitled'; }
    function itemYear(i) {
      const d = i.release_date || i.first_air_date;
      return d ? d.slice(0, 4) : '';
    }
    function itemType(i) {
      if (i.media_type === 'tv') return 'Series';
      return i.title ? 'Film' : 'Series';
    }
    function itemRating(i) { return i.vote_average ? i.vote_average.toFixed(1) : ''; }
    function posterSrc(path, size = 'w342') {
      return path ? `/img/${size}${path}` : null;
    }

    // ── Player ────────────────────────────────────────────────
    const playerView = document.getElementById('player-view');
    const videoEl    = document.getElementById('video');
    const playerTitle = document.getElementById('player-title');
    const statusText = document.getElementById('player-status-text');
    const statusSub  = document.getElementById('player-status-sub');
    let hlsInstance  = null;

    function setStatus(main, sub = '') {
      statusText.className = main ? 'dots' : '';
      statusText.textContent = main;
      statusSub.textContent = sub;
    }

    function openPlayer(item) {
      const t = itemTitle(item);
      const y = itemYear(item);
      const mediaType = item.media_type === 'tv' ? 'series' : 'movie';

      playerTitle.textContent = `${t}${y ? '  ·  ' + y : ''}`;
      playerView.classList.add('open');
      document.body.style.overflow = 'hidden';

      setStatus('Fetching stream', 'This may take a few seconds while the browser resolves the source');
      videoEl.style.visibility = 'hidden';

      fetch('/api/streams', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: String(item.id),
          title: t,
          type: mediaType,
          year: itemYear(item) ? Number(itemYear(item)) : null,
          provider: 'cineby',
        }),
      })
        .then(r => r.json())
        .then(({ streams, error }) => {
          if (error?.includes('BROWSER_LAUNCH_FAILED')) {
            setStatus(
              'Browser not installed',
              'Run this once in your terminal, then restart the server:\n\nbunx playwright install chromium'
            );
            return;
          }
          if (error || !streams?.length) {
            setStatus('No stream found', error || 'Try a different title — not all content is available on every provider.');
            return;
          }

          // Pick highest quality
          const sorted = streams.slice().sort((a, b) => {
            const rank = q => { const m = q.quality?.match(/(\d+)/); return m ? +m[1] : 0; };
            return rank(b) - rank(a);
          });
          const stream = sorted[0];

          setStatus('');
          videoEl.style.visibility = 'visible';

          // Build proxied URL for HLS to avoid CORS/Referer issues
          const proxyUrl = stream.isM3U8
            ? `/hls-proxy?url=${encodeURIComponent(stream.url)}&referer=${encodeURIComponent(stream.referer || '')}`
            : stream.url;

          if (stream.isM3U8 && typeof Hls !== 'undefined' && Hls.isSupported()) {
            if (hlsInstance) hlsInstance.destroy();
            hlsInstance = new Hls({ enableWorker: false });
            hlsInstance.loadSource(proxyUrl);
            hlsInstance.attachMedia(videoEl);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(() => {}));
            hlsInstance.on(Hls.Events.ERROR, (_, data) => {
              if (data.fatal) setStatus('Playback error', data.details || '');
            });
          } else {
            // Native HLS (Safari) or direct stream
            videoEl.src = proxyUrl;
            videoEl.play().catch(() => {});
          }
        })
        .catch(err => {
          setStatus('Error', String(err));
        });
    }

    function closePlayer() {
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      videoEl.pause();
      videoEl.src = '';
      videoEl.style.visibility = 'hidden';
      playerView.classList.remove('open');
      document.body.style.overflow = '';
      setStatus('');
    }

    document.getElementById('player-back').addEventListener('click', closePlayer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && playerView.classList.contains('open')) closePlayer(); });

    // Auto-hide controls after 3 s of no mouse movement
    let hideTimer;
    playerView.addEventListener('mousemove', () => {
      playerView.classList.add('show-ui');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => playerView.classList.remove('show-ui'), 3000);
    });

    // ── Cards ─────────────────────────────────────────────────
    function makeCard(item) {
      const src = posterSrc(item.poster_path);
      const t = itemTitle(item);
      const y = itemYear(item);
      const r = itemRating(item);

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-img">
          ${src ? `<img src="${src}" alt="${t}" loading="lazy">` : ''}
          <div class="card-img-overlay">
            <div class="play-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="white">
                <polygon points="5,3 19,12 5,21"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="card-meta">
          <div class="card-title">${t}</div>
          <div class="card-sub">
            ${y ? `<span>${y}</span>` : ''}
            ${r ? `<span>${r}</span>` : ''}
          </div>
        </div>`;
      card.addEventListener('click', () => openPlayer(item));
      return card;
    }

    // ── Hero ──────────────────────────────────────────────────
    function renderHero(item) {
      const t = itemTitle(item);
      const y = itemYear(item);
      const r = itemRating(item);
      const tp = itemType(item);
      const poster = posterSrc(item.poster_path, 'w500');

      const div = document.createElement('div');
      div.className = 'hero';
      div.innerHTML = `
        <div class="hero-poster">
          ${poster ? `<img src="${poster}" alt="${t}">` : ''}
        </div>
        <div class="hero-info">
          <div class="hero-eyebrow">${tp} · Trending Now</div>
          <h1 class="hero-title">${t}</h1>
          <div class="hero-meta">
            ${y ? `<span>${y}</span>` : ''}
            ${r ? `<span>${r} / 10</span>` : ''}
            ${item.original_language ? `<span>${item.original_language.toUpperCase()}</span>` : ''}
          </div>
          ${item.overview ? `<p class="hero-overview">${item.overview}</p>` : ''}
          <button class="watch-btn" id="hero-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,3 19,12 5,21"/>
            </svg>
            Watch
          </button>
        </div>`;
      div.querySelector('#hero-btn').addEventListener('click', () => openPlayer(item));
      return div;
    }

    function makeGrid(items, cls = 'grid') {
      const el = document.createElement('div');
      el.className = cls;
      items.forEach(i => el.appendChild(makeCard(i)));
      return el;
    }

    function makeSection(label, content) {
      const sec = document.createElement('div');
      sec.className = 'section';
      sec.innerHTML = `<div class="section-label">${label}</div>`;
      sec.appendChild(content);
      return sec;
    }

    // ── Home ──────────────────────────────────────────────────
    function renderHome(trending) {
      const main = document.getElementById('main');
      main.innerHTML = '';

      const [featured, ...rest] = trending;
      const films  = rest.filter(i => i.media_type !== 'tv');
      const series = rest.filter(i => i.media_type === 'tv');

      if (featured) main.appendChild(renderHero(featured));

      const d1 = document.createElement('div'); d1.className = 'divider'; main.appendChild(d1);
      main.appendChild(makeSection('Trending', makeGrid(rest.slice(0, 12), 'grid')));

      if (films.length) {
        const d2 = document.createElement('div'); d2.className = 'divider'; main.appendChild(d2);
        main.appendChild(makeSection('Films', makeGrid(films.slice(0, 7), 'row')));
      }
      if (series.length) {
        const d3 = document.createElement('div'); d3.className = 'divider'; main.appendChild(d3);
        main.appendChild(makeSection('Series', makeGrid(series.slice(0, 7), 'row')));
      }
    }

    // ── Search ────────────────────────────────────────────────
    function renderSearch(results, query) {
      const main = document.getElementById('main');
      main.innerHTML = '';

      const bar = document.createElement('div');
      bar.className = 'search-bar';
      bar.innerHTML = `
        <span class="search-label">Results</span>
        <span class="search-term">"${query}"</span>
        <button class="back-btn" id="back">Clear</button>`;
      bar.querySelector('#back').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        loadHome();
      });
      main.appendChild(bar);

      if (!results.length) {
        const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No results';
        main.appendChild(e);
        return;
      }

      const grid = makeGrid(results, 'grid section');
      grid.style.paddingTop = '0';
      main.appendChild(grid);
    }

    // ── Data ──────────────────────────────────────────────────
    async function apiFetch(path) {
      const r = await fetch('/api' + path);
      if (!r.ok) throw new Error('API error');
      return r.json();
    }

    async function loadHome() {
      document.getElementById('main').innerHTML = '<div class="loading">Loading</div>';
      try {
        const data = await apiFetch('/trending/all/week');
        renderHome((data.results || []).filter(i => i.media_type !== 'person'));
      } catch {
        document.getElementById('main').innerHTML = '<div class="empty">Could not load content</div>';
      }
    }

    let searchTimer;
    document.getElementById('search-input').addEventListener('input', e => {
      clearTimeout(searchTimer);
      const q = e.target.value.trim();
      if (!q) { loadHome(); return; }
      searchTimer = setTimeout(async () => {
        document.getElementById('main').innerHTML = '<div class="loading">Searching</div>';
        try {
          const data = await apiFetch(`/search/multi?query=${encodeURIComponent(q)}&language=en`);
          renderSearch((data.results || []).filter(i => i.media_type !== 'person'), q);
        } catch {
          document.getElementById('main').innerHTML = '<div class="empty">Search failed</div>';
        }
      }, 420);
    });

    document.getElementById('search-input').addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.target.value = ''; loadHome(); }
    });

    loadHome();
  </script>
</body>
</html>
